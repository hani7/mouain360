{% extends "base2.html" %}
{% block title %}Téléverser un Plan d'Étage{% endblock %}

{% block content %}
<div class="upload-container">
    <h2><i class="fas fa-upload"></i> Téléverser un Plan d'Étage</h2>
    <p class="description">Choisissez un fichier image ou PDF à téléverser.</p>

    <form method="post" enctype="multipart/form-data" class="upload-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="upload-btn">
            <i class="fas fa-cloud-upload-alt"></i> Téléverser
        </button>
    </form>
</div>

<style>
.upload-container {
    max-width: 600px;
    margin: 0 auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

.upload-container h2 {
    margin-bottom: 10px;
    color: #333;
}

.upload-container .description {
    color: #666;
    font-size: 14px;
    margin-bottom: 20px;
}

.upload-form label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #444;
}

.upload-form input[type="text"],
.upload-form input[type="file"],
.upload-form textarea,
.upload-form select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 5px;
    font-size: 15px;
}

.upload-btn {
    margin-top: 20px;
    background-color: #007bff;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.upload-btn:hover {
    background-color: #0056b3;
}
</style>
{% endblock %}
