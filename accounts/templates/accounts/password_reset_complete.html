{% extends "base.html" %}

{% block title %}Succès - Mouin 360{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div style="background: rgba(13, 17, 23, 0.8); border: 1px solid rgba(0, 255, 136, 0.4); border-radius: 12px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center;">
        <div style="width: 80px; height: 80px; background: rgba(0, 255, 136, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        
        <h2 style="color: white; font-weight: 700;">Mot de passe mis à jour !</h2>
        <p style="color: rgba(229,233,238,0.7); margin-top: 20px; line-height: 1.6;">
            Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.
        </p>
        
        <div class="mt-4">
            <a href="{% url 'login' %}" class="btn" style="background: var(--primary); color: #0d1117; font-weight: bold; padding: 12px 30px; border-radius: 8px; text-decoration: none;">Se connecter</a>
        </div>
    </div>
</div>
{% endblock %}
